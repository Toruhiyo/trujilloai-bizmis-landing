version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node follows the Node major Vercel builds and runs the api/ functions on (22.x);
      # move it when the project's Node version moves
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
