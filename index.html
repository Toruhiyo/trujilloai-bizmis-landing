<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var ad = params.get("marketing") === "ad-1" || params.get("promo_video") === "opening";
        if (!ad) return;
        var root = document.documentElement;
        root.classList.add("is-promo-opening");
        root.classList.remove("is-promo-cover");
        root.style.setProperty("--ad-warmth", (params.get("part") || "") === "pitch" ? "1" : "0");
        document.write(
          '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">' +
          '<link rel="stylesheet" href="/promo/promo-host.css">' +
          '<link rel="stylesheet" href="/promo/promo-ad-tokens.css">' +
          '<link rel="stylesheet" href="/promo/promo-ad.css">'
        );
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:head (SEO block: the build swaps it for each route's own tags,
         scripts/seo/prerender-plugin.ts; the app keeps them in sync through
         react-helmet-async, src/components/Seo.tsx. Keep other tags outside it.) -->
    <title data-rh="true">Bizmis | Voice-first sales agent for Shopify stores</title>
    <meta name="description" content="Bizmis welcomes shoppers, answers questions, and guides them to buy, like a great in-store associate, 24/7 inside your Shopify store." data-rh="true" />
    <!-- /seo:head -->
    <meta name="author" content="Bizmis" />
    <meta name="google-site-verification" content="JRX-4dx6jtftqdH-V4zDxU91zzRoGgE7tZl4u07ItLY" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bizmis" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: self-hosted (src/styles/fonts.css, public/fonts). Inter's latin
         file, the text of the landing and the site pages, is fetched at once. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "%VITE_GA_MEASUREMENT_ID%");
    </script>

    <script>
      document.documentElement.classList.add("js");
    </script>
    <style>
      .js #prerender-content {
        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root"><!-- seo:body (each route's static text, written by the build) --><!-- /seo:body --></div>

    <noscript>
      <style>
        #prerender-content {
          padding: 2rem;
          max-width: 800px;
          margin: 0 auto;
          font-family: "DM Sans", system-ui, sans-serif;
          line-height: 1.6;
          color: #3b2416;
        }
        #prerender-content h1,
        #prerender-content h2 {
          margin: 1.5em 0 0.5em;
        }
        #prerender-content h1 {
          font-size: 2rem;
        }
        #prerender-content h2 {
          font-size: 1.5rem;
        }
        #prerender-content p {
          margin: 0.5em 0;
        }
        #prerender-content ul {
          padding-left: 1.5em;
          margin: 0.5em 0;
        }
        #prerender-content a {
          color: #3b2416;
          text-decoration: underline;
          text-decoration-color: #f9a353;
        }
        #prerender-content nav {
          display: flex;
          gap: 1.5rem;
          padding: 1rem 0;
        }
        #prerender-content footer {
          margin-top: 3rem;
          padding-top: 1.5rem;
          border-top: 1px solid #e5e5e5;
        }
      </style>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
